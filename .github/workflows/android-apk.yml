name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'config.py'
      - 'renderer.py'
      - 'audio_*.py'
      - 'narration.py'
      - 'elevenlabs_tts.py'
      - 'emoji_support.py'
      - 'visual_engine.py'
      - 'text_processor.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libssl-dev \
            libltdl-dev ccache gettext libdouble-conversion3 libclang-18-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'PySide6==6.12.0' 'aqtinstall>=3.2,<4' 'buildozer>=1.5,<2' 'Cython>=0.29.36,<4'
          python -m pip install 'Pillow>=10,<13' 'numpy>=2,<3' 'httpx>=0.27,<1' 'elevenlabs>=2,<3'

      - name: Install open-source Qt Android kit and build Qt for Python Android wheels
        run: |
          git clone --depth 1 --branch 6.12 https://code.qt.io/pyside/pyside-setup.git "$RUNNER_TEMP/pyside-setup"
          python -m pip install -r "$RUNNER_TEMP/pyside-setup/requirements.txt" \
            -r "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt"
          aqt install-qt all_os android 6.12.0 android_arm64_v8a \
            --outputdir "$RUNNER_TEMP/Qt" --autodesktop
          cd "$RUNNER_TEMP/pyside-setup"
          python tools/cross_compile_android/main.py --download-only \
            --auto-accept-license --skip-update

      - name: Restore cached Qt for Python Android wheels
        id: qt-wheels-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pyside-setup/dist_android
          key: pyside-android-wheels-6.12.0-android-aarch64-v1

      - name: Cross-compile Qt for Python Android wheels
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          template = Path(os.environ["RUNNER_TEMP"]) / "pyside-setup/tools/cross_compile_android/templates/toolchain_default.tmpl.cmake"
          text = template.read_text()
          marker = "set(CMAKE_SYSTEM_NAME Android)"
          host_qt = (Path(os.environ["RUNNER_TEMP"]) / "Qt/6.12.0/gcc_64").as_posix()
          replacement = f'set(QT_HOST_PATH "{host_qt}" CACHE PATH "Host Qt installation")\n' + marker
          if marker not in text:
              raise SystemExit("Could not inject the Qt host path into the Android toolchain")
          template.write_text(text.replace(marker, replacement, 1))
          PY
          mkdir -p "$RUNNER_TEMP/pyside-setup/dist_android"
          PYSIDE_WHEEL=$(find "$RUNNER_TEMP/pyside-setup/dist_android" -iname 'pyside6-*.whl' -print -quit)
          SHIBOKEN_WHEEL=$(find "$RUNNER_TEMP/pyside-setup/dist_android" -iname 'shiboken6-*.whl' -print -quit)
          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            cd "$RUNNER_TEMP/pyside-setup"
            python tools/cross_compile_android/main.py --plat-name=aarch64 \
              --qt-install-path="$RUNNER_TEMP/Qt/6.12.0" \
              --auto-accept-license --skip-update
          fi

      - name: Cache Qt for Python Android wheels
        if: always() && steps.qt-wheels-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pyside-setup/dist_android
          key: pyside-android-wheels-6.12.0-android-aarch64-v1

      - name: Build arm64 APK
        run: |
          python -m pip install -r "$RUNNER_TEMP/pyside-setup/sources/pyside-tools/requirements-android.txt"
          python - <<'PY'
          from pathlib import Path
          import PySide6
          deploy = Path(PySide6.__file__).parent / "scripts/deploy_lib/android/buildozer.py"
          source = deploy.read_text()
          old = 'self.set_value("app", "requirements", "python3,shiboken6,PySide6")'
          new = 'self.set_value("app", "requirements", "python3,shiboken6,PySide6,Pillow,numpy,httpx,elevenlabs")'
          if old not in source:
              raise SystemExit("Could not add the app's Android Python dependencies")
          source = source.replace(old, new, 1)
          old = 'self.set_value("buildozer", "bin_dir", str(pysidedeploy_config.exe_dir.resolve()))'
          new = old + '\n        self.set_value("buildozer", "log_level", "2")'
          if old not in source:
              raise SystemExit("Could not enable detailed Buildozer logs")
          source = source.replace(old, new, 1)
          old = 'command = [sys.executable, "-m", "buildozer", "android", mode]'
          new = 'command = [sys.executable, "-m", "buildozer", "-v", "android", mode]'
          if old not in source:
              raise SystemExit("Could not enable verbose Buildozer output")
          deploy.write_text(source.replace(old, new, 1))
          PY
          ANDROID_PROJECT="$RUNNER_TEMP/android-project"
          mkdir -p "$ANDROID_PROJECT"
          cp android_app/main.py "$ANDROID_PROJECT/main.py"
          for module in config.py renderer.py animations.py audio_engine.py audio_export.py \
            batch_generator.py elevenlabs_tts.py narration.py emoji_support.py visual_engine.py text_processor.py; do
            cp "$module" "$ANDROID_PROJECT/"
          done
          find "$RUNNER_TEMP/pyside-setup" -type f -name '*.whl' -print
          PYSIDE_WHEEL=$(find "$RUNNER_TEMP/pyside-setup/dist_android" -iname 'pyside6-*.whl' -print -quit)
          SHIBOKEN_WHEEL=$(find "$RUNNER_TEMP/pyside-setup/dist_android" -iname 'shiboken6-*.whl' -print -quit)
          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"
          cd "$ANDROID_PROJECT"
          DEPLOY_LOG="$RUNNER_TEMP/android-deploy.log"
          DEPLOY_EXIT=0
          pyside6-android-deploy --force --name AutoShortsStudio \
            --wheel-pyside "$PYSIDE_WHEEL" --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --extra-modules Core,Gui,Widgets,Network > "$DEPLOY_LOG" 2>&1 || DEPLOY_EXIT=$?
          APK_PATH=$(find "$ANDROID_PROJECT" -type f -name '*.apk' -print -quit)
          if [ "$DEPLOY_EXIT" -ne 0 ] || [ -z "$APK_PATH" ]; then
            tail -n 240 "$DEPLOY_LOG"
            echo "Deploy exit code: $DEPLOY_EXIT; APK path: ${APK_PATH:-missing}"
            echo "--- Buildozer/python-for-android diagnostic matches ---"
            find "$HOME/.buildozer" "$ANDROID_PROJECT/.buildozer" "$ANDROID_PROJECT" -type f \
              \( -name '*.log' -o -name '*.txt' -o -name 'buildozer.spec' \) -print0 2>/dev/null \
              | while IFS= read -r -d '' logfile; do
                  echo "--- $logfile ---"
                  grep -Ein -C 2 'error|failed|exception|traceback|could not|not found|no such file|recipe|returned non-zero' "$logfile" \
                    | tail -n 100 || true
                done
            [ "$DEPLOY_EXIT" -ne 0 ] || { echo "Deploy returned success without creating an APK"; exit 1; }
            exit 1
          fi
          tail -n 60 "$DEPLOY_LOG"
          python - "$APK_PATH" <<'PY'
          import sys
          import zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
          assert "AndroidManifest.xml" in names, "APK is missing AndroidManifest.xml"
          assert any(n.endswith(".dex") for n in names), "APK is missing DEX bytecode"
          assert any(n.startswith("lib/arm64-v8a/") and n.endswith(".so") for n in names), "APK is missing arm64 native libraries"
          print(f"Verified APK: {apk} ({apk.stat().st_size} bytes, {len(names)} entries)")
          PY
          mkdir -p "$GITHUB_WORKSPACE/android_app/release"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/android_app/release/AutoShortsStudio.apk"

      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-shorts-studio-android-debug
          path: android_app/release/AutoShortsStudio.apk
          if-no-files-found: error
          retention-days: 14
