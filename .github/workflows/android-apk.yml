name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'main.py'
      - 'config.py'
      - 'renderer.py'
      - 'audio_*.py'
      - 'narration.py'
      - 'elevenlabs_tts.py'
      - 'emoji_support.py'
      - 'visual_engine.py'
      - 'text_processor.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev ccache gettext libdouble-conversion3 libclang-18-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'PySide6==6.10.2' 'aqtinstall>=3.2,<4' 'buildozer>=1.5,<2' 'Cython>=0.29.36,<4'
          python -m pip install 'Pillow>=10,<13' 'numpy>=2,<3' 'httpx>=0.27,<1' 'elevenlabs>=2,<3'

      - name: Install open-source Qt Android kit and build Qt for Python Android wheels
        run: |
          git clone --depth 1 --branch 6.10 https://code.qt.io/pyside/pyside-setup.git "$RUNNER_TEMP/pyside-setup"
          python -m pip install -r "$RUNNER_TEMP/pyside-setup/requirements.txt" \
            -r "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt"
          aqt install-qt all_os android 6.10.2 android_arm64_v8a \
            --outputdir "$RUNNER_TEMP/Qt" --autodesktop
          cd "$RUNNER_TEMP/pyside-setup"
          python tools/cross_compile_android/main.py --download-only \
            --auto-accept-license --skip-update

      - name: Build Android libffi for the embedded Python runtime
        run: |
          set -euxo pipefail
          NDK="$HOME/.pyside6_android_deploy/android-ndk"
          CC_BIN=$(find "$NDK" -name 'aarch64-linux-android35-clang' -print -quit)
          test -n "$CC_BIN" || { find "$NDK" -maxdepth 6 -print; exit 1; }
          TOOLCHAIN="$(dirname "$CC_BIN")"
          git clone --depth 1 --branch v3.4.8 https://github.com/libffi/libffi.git "$RUNNER_TEMP/libffi-src"
          cd "$RUNNER_TEMP/libffi-src"
          ./autogen.sh
          mkdir "$RUNNER_TEMP/libffi-build"
          cd "$RUNNER_TEMP/libffi-build"
          if ! CFLAGS='-fPIC' CC="$CC_BIN" \
            AR="$TOOLCHAIN/llvm-ar" RANLIB="$TOOLCHAIN/llvm-ranlib" \
            "$RUNNER_TEMP/libffi-src/configure" \
              --host=aarch64-linux-android --prefix="$RUNNER_TEMP/android-libffi" \
              --disable-shared --enable-static; then
            cat config.log
            exit 1
          fi
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/android-libffi/lib/pkgconfig" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          from pathlib import Path
          template = Path(os.environ["RUNNER_TEMP"]) / "pyside-setup/tools/cross_compile_android/templates/cross_compile.tmpl.sh"
          text = template.read_text()
          old = "export CFLAGS='-fPIC -DANDROID'"
          new = 'export CFLAGS="-fPIC -DANDROID -I$RUNNER_TEMP/android-libffi/include"\nexport LDFLAGS="-L$RUNNER_TEMP/android-libffi/lib"'
          if old not in text:
              raise SystemExit("Could not add Android libffi flags to the CPython cross-build template")
          template.write_text(text.replace(old, new))
          PY

      - name: Cross-compile Qt for Python Android wheels
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/pyside-setup"
          python tools/cross_compile_android/main.py --plat-name=aarch64 \
            --qt-install-path="$RUNNER_TEMP/Qt/6.10.2" \
            --auto-accept-license --skip-update

      - name: Build arm64 APK
        run: |
          find "$RUNNER_TEMP/pyside-setup" -type f -name '*.whl' -print
          PYSIDE_WHEEL=$(find "$RUNNER_TEMP/pyside-setup/dist_android" -name 'PySide6-*.whl' -print -quit)
          SHIBOKEN_WHEEL=$(find "$RUNNER_TEMP/pyside-setup/dist_android" -name 'shiboken6-*.whl' -print -quit)
          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"
          pyside6-android-deploy --force --name AutoShortsStudio \
            --wheel-pyside "$PYSIDE_WHEEL" --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --extra-modules Core,Gui,Widgets,Network

      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-shorts-studio-android-debug
          path: '**/*.apk'
          if-no-files-found: error
          retention-days: 14
